[tools]
uv = "latest"

[settings]
python.uv_venv_auto = true

[tasks.sync]
run = [
    "uv sync",
    "rm -rf ./forceatlas2/fa2/fa2util.cpython-*.so ./forceatlas2/fa2/fa2util.c ./forceatlas2/build/",
    "uv pip install -e ./forceatlas2/"
]

[tasks.sync_dev]
run = [
    "uv sync",
    "uv pip install -e ./ESFS/.[gpu]",
]

[tasks.format]
run = [
    "pyproject-fmt pyproject.toml || true",
    "uv run ruff format",
    "uv run ruff check --fix"
]

[tasks.lint]
run = "pyright src || uv run ruff check || uv run ty check"

[tasks.kernel]
run = "uv run ipython kernel install --name 'micropattern' --user"
